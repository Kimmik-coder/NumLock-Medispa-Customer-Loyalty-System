<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>MediSpa - Report</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div class="app">
    <div class="sidebar" id="sidebar-slot"></div>
    <div class="main">
      <div class="topbar" id="topbar-slot"></div>

      <div class="kpi-row">
        <div class="kpi-card">
          <div class="kpi-label">Total Revenue</div>
          <div class="kpi-value" id="r-revenue">0</div>
        </div>
        <div class="kpi-card">
          <div class="kpi-label">Total Transactions</div>
          <div class="kpi-value" id="r-count">0</div>
        </div>
        <div class="kpi-card">
          <div class="kpi-label">Avg. Transaction</div>
          <div class="kpi-value" id="r-avg">0</div>
        </div>
      </div>

      <div class="card">
        <h2>Top Customers by Points</h2>
        <table>
          <thead><tr><th>Name</th><th>Points</th><th>Total Spent</th></tr></thead>
          <tbody id="r-rows"></tbody>
        </table>
        <div id="r-empty" class="empty-state" style="display:none;">No data yet.</div>
      </div>

      <div class="card">
        <button class="btn solid" id="print-report">Print This Report</button>
      </div>
    </div>
  </div>

  <script src="js/app.js"></script>
  <script>
    requireAuth();
    renderShell('report.html', 'Report');

    const customers = readDB(DB_KEYS.customers, []);
    const txns = readDB(DB_KEYS.transactions, []);

    const totalRevenue = txns.reduce((s, t) => s + Number(t.amount || 0), 0);
    document.getElementById('r-revenue').textContent = money(totalRevenue);
    document.getElementById('r-count').textContent = txns.length;
    document.getElementById('r-avg').textContent = money(txns.length ? totalRevenue / txns.length : 0);

    const spentByCustomer = {};
    txns.forEach(t => { spentByCustomer[t.customerId] = (spentByCustomer[t.customerId] || 0) + Number(t.amount || 0); });

    const ranked = [...customers].sort((a, b) => (b.points || 0) - (a.points || 0));
    const rowsEl = document.getElementById('r-rows');
    document.getElementById('r-empty').style.display = ranked.length ? 'none' : 'block';
    rowsEl.innerHTML = ranked.map(c => `
      <tr><td>${c.name}</td><td>${c.points || 0}</td><td>${money(spentByCustomer[c.id] || 0)}</td></tr>
    `).join('');

    document.getElementById('print-report').addEventListener('click', () => window.print());
  </script>
</body>
</html>
