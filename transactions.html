<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>MediSpa - Transactions</title>
<link rel="stylesheet" href="css/style.css">
<style>
  /* ---- Page-scoped additions. Kapareho ng customers.html. ---- */
  .form-grid { align-items: start; }
  .field { position: relative; padding-bottom: 20px; }
  .field .hint,
  .field .err {
    position: absolute; top: 100%; left: 0; margin-top: -16px;
    font-size: 12px; line-height: 1.3;
  }
  .field .hint { opacity: .65; }
  .field .err { color: #c0392b; display: none; }
  .field.invalid input,
  .field.invalid select { border-color: #c0392b; }
  .field.invalid .err { display: block; }
  .field.invalid .hint { display: none; }

  .row-actions { white-space: nowrap; }
  .num { text-align: right; font-variant-numeric: tabular-nums; }

  @media (max-width: 900px) { .form-grid { grid-template-columns: 1fr 1fr; } }
  @media (max-width: 640px) {
    .form-grid { grid-template-columns: 1fr; }
    .form-grid .btn { width: 100%; }
    .panel-head { flex-direction: column; align-items: flex-start; gap: 8px; }
    .table-wrap { overflow-x: auto; -webkit-overflow-scrolling: touch; }
    .table-wrap table { min-width: 640px; }
  }
</style>
</head>
<body>
  <div class="app">
    <div class="sidebar" id="sidebar-slot"></div>
    <div class="main">
      <div class="topbar" id="topbar-slot"></div>

      <div class="card">
        <h2>New transaction</h2>
        <div class="card-subtitle">Record a purchase and the system computes the loyalty points.</div>
        <form id="txn-form" class="form-grid" novalidate>
          <div class="field" id="f-cust">
            <label for="txn-customer">Customer</label>
            <select id="txn-customer"></select>
            <div class="err" id="e-cust"></div>
          </div>
          <div class="field" id="f-amount">
            <label for="txn-amount">Amount</label>
            <input id="txn-amount" type="number" min="0.01" step="0.01" placeholder="0.00" inputmode="decimal">
            <div class="hint" id="points-preview">Earns 0 points</div>
            <div class="err" id="e-amount"></div>
          </div>
          <div class="field" id="f-date">
            <label for="txn-date">Date</label>
            <input id="txn-date" type="date">
            <div class="err" id="e-date"></div>
          </div>
          <button class="btn solid" type="submit">Record transaction</button>
        </form>
        <p style="font-size:12px;color:var(--text-muted);margin-top:10px;" id="rule-text"></p>
      </div>

      <div class="card">
        <div class="panel-head">
          <div>
            <h2 style="margin-bottom:4px;">Transaction history</h2>
            <div class="card-subtitle" style="margin:0;">Review recorded purchases and points earned by each customer.</div>
          </div>
          <span class="badge member" id="txn-count">0 transactions</span>
        </div>
        <div class="table-wrap"><table>
          <thead><tr><th>Date</th><th>Customer</th><th class="num">Amount</th><th class="num">Points earned</th><th></th></tr></thead>
          <tbody id="txn-rows"></tbody>
        </table></div>
        <div id="txn-empty" class="empty-state" style="display:none;">No transactions yet. Record one above to start earning points.</div>
      </div>
    </div>
  </div>

  <script src="js/app.js"></script>
  <script>
    const session = requireAuth();
    renderShell('transactions.html', 'Transactions');

    // Staff record transactions but must not be able to delete them
    // (a deletable transaction is an easy way to pocket cash and erase
    // the trail). Only admin can delete.
    const isAdmin = !!session && session.role === 'admin';

    /* ---------- Settings (tanggap ang luma at bagong key names) ---------- */
    const raw = readDB(DB_KEYS.settings, {});
    const settings = {
      pointsPer:       raw.pointsPer       ?? raw.pointsPerAmount ?? 12,
      spendPer:        raw.spendPer        ?? raw.amountUnit      ?? 110,
      redeemThreshold: raw.redeemThreshold ?? 100,
      storeName:       raw.storeName       ?? 'MediSpa',
      currency:        raw.currency        ?? '\u20B1'
    };

    /* ---------- Helpers ---------- */
    const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, m => (
      { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[m]
    ));

    function peso(n) {
      return settings.currency + (Number(n) || 0).toLocaleString('en-PH', {
        minimumFractionDigits: 2, maximumFractionDigits: 2
      });
    }

    function formatDate(iso) {
      if (!iso) return '-';
      const d = new Date(iso);
      if (isNaN(d)) return esc(iso);
      return d.toLocaleDateString('en-PH', { year: 'numeric', month: 'short', day: '2-digit' });
    }

    function pointsFor(amount) {
      return Math.floor((Number(amount) || 0) / settings.spendPer) * settings.pointsPer;
    }

    const today = () => new Date().toISOString().slice(0, 10);

    const loadCustomers = () => readDB(DB_KEYS.customers, []);
    const saveCustomers = list => writeDB(DB_KEYS.customers, list);
    const loadTxns = () => readDB(DB_KEYS.transactions, []);
    const saveTxns = list => writeDB(DB_KEYS.transactions, list);

    function displayName(c) {
      if (!c) return 'Unknown customer';
      if (c.lastName || c.firstName) {
        return `${c.lastName || ''}${c.lastName && c.firstName ? ', ' : ''}${c.firstName || ''}`;
      }
      return c.name || '-';
    }

    document.getElementById('rule-text').textContent =
      `Earns ${settings.pointsPer} points per ${settings.currency}${settings.spendPer} spent. ` +
      `A customer can redeem a reward once they reach ${settings.redeemThreshold} points.`;

    /* ---------- Customer dropdown ---------- */
    const custSelect = document.getElementById('txn-customer');
    function fillCustomerSelect() {
      const custs = loadCustomers();
      if (!custs.length) {
        custSelect.innerHTML = '<option value="">No customers yet — add one first</option>';
        return;
      }
      custSelect.innerHTML = '<option value="">Select customer</option>' +
        custs
          .slice()
          .sort((a, b) => displayName(a).localeCompare(displayName(b)))
          .map(c => `<option value="${esc(c.id)}">${esc(displayName(c))} (${c.points || 0} pts)</option>`)
          .join('');
    }
    fillCustomerSelect();
    document.getElementById('txn-date').value = today();

    /* ---------- Validation ---------- */
    function setError(fieldId, msg) {
      const f = document.getElementById(fieldId);
      const e = document.getElementById(fieldId.replace('f-', 'e-'));
      if (msg) { f.classList.add('invalid'); e.textContent = msg; }
      else { f.classList.remove('invalid'); e.textContent = ''; }
      return !msg;
    }
    function clearErrors() { ['f-cust', 'f-amount', 'f-date'].forEach(id => setError(id, '')); }

    const amountInput = document.getElementById('txn-amount');
    amountInput.addEventListener('input', function () {
      const pts = pointsFor(this.value);
      document.getElementById('points-preview').textContent =
        `Earns ${pts} point${pts === 1 ? '' : 's'}`;
    });

    /* ---------- Table ---------- */
    function renderTxnTable() {
      const custs = loadCustomers();
      const list = loadTxns().slice().sort((a, b) => String(b.date).localeCompare(String(a.date)));
      document.getElementById('txn-empty').style.display = list.length ? 'none' : 'block';
      document.getElementById('txn-count').textContent =
        `${list.length} transaction${list.length === 1 ? '' : 's'}`;

      document.getElementById('txn-rows').innerHTML = list.map(t => {
        const c = custs.find(x => x.id === t.customerId);
        const name = c ? displayName(c) : (t.customerName || 'Deleted customer');
        // Only admin can delete a recorded transaction; staff cannot, so
        // a transaction can't quietly be entered then erased to hide cash.
        const delCell = isAdmin
          ? `<button class="btn danger" data-del="${esc(t.id)}">Delete</button>`
          : `<span style="color:var(--text-muted);font-size:12px;">Admin only</span>`;
        return `
        <tr>
          <td>${formatDate(t.date)}</td>
          <td>${esc(name)}</td>
          <td class="num">${peso(t.amount)}</td>
          <td class="num">${t.pointsEarned || 0}</td>
          <td class="row-actions">${delCell}</td>
        </tr>`;
      }).join('');
    }

    /* ---------- Record ---------- */
    document.getElementById('txn-form').addEventListener('submit', function (e) {
      e.preventDefault();
      clearErrors();
      let ok = true;

      const custId = custSelect.value;
      const custs = loadCustomers();
      const cust = custs.find(c => c.id === custId);
      if (!cust) ok = setError('f-cust', 'Choose a customer.') && ok;

      const amount = parseFloat(amountInput.value);
      if (!Number.isFinite(amount) || amount <= 0) {
        ok = setError('f-amount', 'Enter an amount greater than 0.') && ok;
      } else if (amount > 1000000) {
        ok = setError('f-amount', 'That amount looks too large. Check it again.') && ok;
      }

      const date = document.getElementById('txn-date').value;
      if (!date) ok = setError('f-date', 'Pick a date.') && ok;
      else if (date > today()) ok = setError('f-date', 'Date cannot be in the future.') && ok;

      if (!ok) return;

      const rounded = Math.round(amount * 100) / 100;
      const pointsEarned = pointsFor(rounded);

      const txns = loadTxns();
      txns.push({
        id: cryptoId(),
        customerId: cust.id,
        customerName: displayName(cust),
        amount: rounded,
        pointsEarned,
        date
      });
      saveTxns(txns);

      const before = cust.points || 0;
      cust.points = before + pointsEarned;
      saveCustomers(custs);

      toast(`Recorded \u2014 ${displayName(cust)} earned ${pointsEarned} pts`);
      renderTxnTable();
      fillCustomerSelect();

      this.reset();
      clearErrors();
      document.getElementById('txn-date').value = today();
      document.getElementById('points-preview').textContent = 'Earns 0 points';

      // Redemption itself is requested and approved manually on the
      // Customers page (both staff and admin can do that there). Here
      // we just let whoever recorded the sale know the customer now
      // qualifies for a reward.
      if (before < settings.redeemThreshold && cust.points >= settings.redeemThreshold) {
        toast(`${displayName(cust)} has reached ${settings.redeemThreshold} points \u2014 redeem on the Customers page.`, 'success');
      }
    });

    /* ---------- Delete (ibinabalik ang points) ---------- */
    document.getElementById('txn-rows').addEventListener('click', async function (e) {
      const btn = e.target.closest('button');
      if (!btn) return;
      const delId = btn.getAttribute('data-del');
      if (!delId) return;
      if (!isAdmin) { toast('Only an admin can delete a transaction.', 'warning'); return; }

      const txns = loadTxns();
      const t = txns.find(x => x.id === delId);
      if (!t) return;
      const ok = await confirmDialog(`Delete this ${peso(t.amount)} transaction? ${t.pointsEarned || 0} points will be taken back.`, { title: 'Delete transaction', confirmText: 'Delete', danger: true });
      if (!ok) return;

      const custs = loadCustomers();
      const c = custs.find(x => x.id === t.customerId);
      if (c) {
        c.points = Math.max(0, (c.points || 0) - (t.pointsEarned || 0));
        saveCustomers(custs);
      }
      saveTxns(txns.filter(x => x.id !== delId));
      renderTxnTable();
      fillCustomerSelect();
      toast('Transaction deleted');
    });

    renderTxnTable();
  </script>
</body>
</html>
