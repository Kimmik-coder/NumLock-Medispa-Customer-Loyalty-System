<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>MediSpa - Dashboard</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div class="app">
    <div class="sidebar" id="sidebar-slot"></div>
    <div class="main">
      <div class="topbar" id="topbar-slot"></div>

      <div class="kpi-row">
        <div class="kpi-card">
          <div class="kpi-label">Total Customers</div>
          <div class="kpi-value" id="kpi-customers">0</div>
        </div>
        <div class="kpi-card">
          <div class="kpi-label">Total Revenue</div>
          <div class="kpi-value" id="kpi-revenue">0</div>
        </div>
        <div class="kpi-card">
          <div class="kpi-label">Loyalty Members</div>
          <div class="kpi-value" id="kpi-loyalty">0</div>
        </div>
      </div>

      <div class="content-row">
        <div class="panel">
          <h2>Sales Overview</h2>
          <canvas id="sales-canvas" width="600" height="220" style="width:100%;height:220px;"></canvas>
        </div>
        <div class="panel">
          <h2>Recent Customer</h2>
          <div class="recent-list" id="recent-list"></div>
        </div>
      </div>
    </div>
  </div>

  <script src="js/app.js"></script>
  <script>
    requireAuth();
    renderShell('dashboard.html', 'Dashboard');

    const customers = readDB(DB_KEYS.customers, []);
    const transactions = readDB(DB_KEYS.transactions, []);
    const settings = readDB(DB_KEYS.settings, { redeemThreshold: 100 });

    // KPIs
    document.getElementById('kpi-customers').textContent = customers.length;
    const totalRevenue = transactions.reduce((sum, t) => sum + Number(t.amount || 0), 0);
    document.getElementById('kpi-revenue').textContent = money(totalRevenue);
    const loyaltyMembers = customers.filter(c => (c.points || 0) >= settings.redeemThreshold).length;
    document.getElementById('kpi-loyalty').textContent = loyaltyMembers;

    // Recent customers (last joined first)
    const recent = [...customers].sort((a, b) => (b.joined || '').localeCompare(a.joined || '')).slice(0, 5);
    const listEl = document.getElementById('recent-list');
    listEl.innerHTML = recent.length ? recent.map(c => `
      <div class="recent-item"><span class="avatar">${initials(c.name)}</span>${c.name}</div>
    `).join('') : '<div class="empty-state">No customers yet.</div>';

    // Simple bar+line sales overview, grouped by day, drawn on canvas (no external charting library needed).
    (function drawChart() {
      const canvas = document.getElementById('sales-canvas');
      const ctx = canvas.getContext('2d');
      const byDate = {};
      transactions.forEach(t => { byDate[t.date] = (byDate[t.date] || 0) + Number(t.amount || 0); });
      const dates = Object.keys(byDate).sort();
      const values = dates.map(d => byDate[d]);
      const w = canvas.width, h = canvas.height, pad = 30;

      ctx.clearRect(0, 0, w, h);
      if (!dates.length) {
        ctx.fillStyle = '#5b6b85';
        ctx.font = '13px sans-serif';
        ctx.fillText('No transactions yet — add one on the Transaction page.', 20, h / 2);
        return;
      }
      const max = Math.max(...values, 1);
      const barW = (w - pad * 2) / dates.length * 0.6;
      const gap = (w - pad * 2) / dates.length;

      dates.forEach((d, i) => {
        const val = values[i];
        const barH = (val / max) * (h - pad * 2);
        const x = pad + i * gap + (gap - barW) / 2;
        const y = h - pad - barH;
        ctx.fillStyle = '#2f5dae';
        ctx.fillRect(x, y, barW, barH);
        ctx.fillStyle = '#5b6b85';
        ctx.font = '10px sans-serif';
        ctx.fillText(d.slice(5), x - 4, h - pad + 12);
      });

      // trend line
      ctx.beginPath();
      ctx.strokeStyle = '#c94f4f';
      ctx.lineWidth = 1.5;
      dates.forEach((d, i) => {
        const val = values[i];
        const x = pad + i * gap + gap / 2;
        const y = h - pad - (val / max) * (h - pad * 2);
        if (i === 0) ctx.moveTo(x, y); else ctx.lineTo(x, y);
      });
      ctx.stroke();
    })();
  </script>
</body>
</html>
