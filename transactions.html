<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>MediSpa - Transaction</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div class="app">
    <div class="sidebar" id="sidebar-slot"></div>
    <div class="main">
      <div class="topbar" id="topbar-slot"></div>

      <div class="card">
        <h2>New Transaction</h2>
        <form id="txn-form" class="form-grid">
          <div class="field">
            <label>Customer</label>
            <select id="txn-customer" required></select>
          </div>
          <div class="field">
            <label>Amount</label>
            <input id="txn-amount" type="number" min="0" step="0.01" required>
          </div>
          <div class="field">
            <label>Date</label>
            <input id="txn-date" type="date" required>
          </div>
          <button class="btn solid" type="submit">Record Transaction</button>
        </form>
        <p style="font-size:12px;color:var(--text-muted);margin-top:10px;" id="rule-text"></p>
      </div>

      <div class="card">
        <h2>Transaction History</h2>
        <table>
          <thead><tr><th>Date</th><th>Customer</th><th>Amount</th><th>Points Earned</th><th></th></tr></thead>
          <tbody id="txn-rows"></tbody>
        </table>
        <div id="txn-empty" class="empty-state" style="display:none;">No transactions recorded yet.</div>
      </div>
    </div>
  </div>

  <!-- printable voucher, hidden on screen, shown only when printing -->
  <div id="voucher-print">
    <div class="voucher">
      <h2 id="v-store">MediSpa</h2>
      <div>Loyalty Reward Voucher</div>
      <div class="amount" id="v-points">0 pts</div>
      <div id="v-customer">Customer: -</div>
      <div class="meta" id="v-meta"></div>
    </div>
  </div>

  <script src="js/app.js"></script>
  <script>
    requireAuth();
    renderShell('transactions.html', 'Transaction');

    const settings = readDB(DB_KEYS.settings, { pointsPerAmount: 10, amountUnit: 100, redeemThreshold: 100, storeName: 'MediSpa' });
    document.getElementById('rule-text').textContent =
      `Earns ${settings.pointsPerAmount} points per ${settings.amountUnit} spent. ` +
      `A voucher offer prints automatically once a customer reaches ${settings.redeemThreshold} points.`;

    function loadCustomers() { return readDB(DB_KEYS.customers, []); }
    function saveCustomers(list) { writeDB(DB_KEYS.customers, list); }
    function loadTxns() { return readDB(DB_KEYS.transactions, []); }
    function saveTxns(list) { writeDB(DB_KEYS.transactions, list); }

    // populate customer select
    const custSelect = document.getElementById('txn-customer');
    function fillCustomerSelect() {
      const custs = loadCustomers();
      custSelect.innerHTML = custs.map(c => `<option value="${c.id}">${c.name}</option>`).join('')
        || '<option value="">No customers — add one first</option>';
    }
    fillCustomerSelect();
    document.getElementById('txn-date').value = new Date().toISOString().slice(0, 10);

    function renderTxnTable() {
      const list = [...loadTxns()].sort((a, b) => b.date.localeCompare(a.date));
      const rows = document.getElementById('txn-rows');
      document.getElementById('txn-empty').style.display = list.length ? 'none' : 'block';
      rows.innerHTML = list.map(t => `
        <tr>
          <td>${t.date}</td>
          <td>${t.customerName}</td>
          <td>${money(t.amount)}</td>
          <td>${t.pointsEarned}</td>
          <td class="row-actions"><button class="btn danger" data-del="${t.id}">Delete</button></td>
        </tr>
      `).join('');
    }
    renderTxnTable();

    document.getElementById('txn-form').addEventListener('submit', function (e) {
      e.preventDefault();
      const custId = custSelect.value;
      const custs = loadCustomers();
      const cust = custs.find(c => c.id === custId);
      if (!cust) { toast('Add a customer first'); return; }

      const amount = parseFloat(document.getElementById('txn-amount').value || '0');
      const date = document.getElementById('txn-date').value;
      const pointsEarned = Math.floor(amount / settings.amountUnit) * settings.pointsPerAmount;

      // save transaction
      const txns = loadTxns();
      txns.push({
        id: cryptoId(), customerId: cust.id, customerName: cust.name,
        amount, pointsEarned, date
      });
      saveTxns(txns);

      // update customer points (threshold check / "point calculations")
      const before = cust.points || 0;
      const after = before + pointsEarned;
      cust.points = after;
      saveCustomers(custs);

      toast(`Recorded — ${cust.name} earned ${pointsEarned} pts`);
      renderTxnTable();

      // Threshold crossed this transaction -> offer a printable voucher.
      if (before < settings.redeemThreshold && after >= settings.redeemThreshold) {
        openVoucher(cust, after);
      }

      this.reset();
      document.getElementById('txn-date').value = new Date().toISOString().slice(0, 10);
    });

    document.getElementById('txn-rows').addEventListener('click', function (e) {
      const delId = e.target.getAttribute('data-del');
      if (!delId) return;
      if (!confirm('Delete this transaction?')) return;
      saveTxns(loadTxns().filter(t => t.id !== delId));
      renderTxnTable();
      toast('Transaction deleted');
    });

    function openVoucher(cust, points) {
      document.getElementById('v-store').textContent = settings.storeName || 'MediSpa';
      document.getElementById('v-points').textContent = points + ' pts';
      document.getElementById('v-customer').textContent = 'Customer: ' + cust.name;
      document.getElementById('v-meta').textContent = 'Issued ' + new Date().toLocaleDateString() + ' — present this voucher in store to redeem.';
      if (confirm(cust.name + ' has reached ' + points + ' points and qualifies for a loyalty reward. Print a voucher now?')) {
        window.print();
      }
    }
  </script>
</body>
</html>
